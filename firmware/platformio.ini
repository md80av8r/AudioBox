; MD-88 Crew Audio Breakout Box — rev C firmware
; ESP32-WROVER-E-N8R8 (8MB flash, 8MB PSRAM)

[env:esp32-wrover]
platform      = espressif32
board         = esp32-wrover-kit
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_build.f_flash = 80000000L
board_build.psram_type = qio

build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=3
  ; LVGL — use our own config header
  -DLV_CONF_INCLUDE_SIMPLE
  -I src
  ; TFT_eSPI — inline config for ILI9341 on the rev C pin scheme
  -DUSER_SETUP_LOADED=1
  -DILI9341_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=-1
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=5
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=19
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=40000000

lib_deps =
  ; UI — LVGL 8.x (stable, well-documented; 9.x has breaking API changes)
  lvgl/lvgl @ ^8.3.11
  bodmer/TFT_eSPI @ ^2.5.43
  ; Sensors
  adafruit/Adafruit BME280 Library @ ^2.2.4
  adafruit/RTClib @ ^2.1.4
  ; Encoder + buttons
  madhephaestus/ESP32Encoder @ ^0.11.0
  thomasfredericks/Bounce2 @ ^2.72
